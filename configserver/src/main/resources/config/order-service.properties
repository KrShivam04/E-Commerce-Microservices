

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/order
spring.datasource.username=shivam
spring.datasource.password=shivam
spring.jpa.database=postgresql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


logging.file.name=logs/${spring.application.name}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7

management.tracing.sampling.probability=1.0

eureka.instance.prefer-ip-address=true

################################
# Circuit Breaker Configuration
################################

management.health.circuitbreakers.enabled=true
resilience4j.circuitbreaker.instances.orderService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.orderService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.orderService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.orderService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.orderService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.orderService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.orderService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.orderService.slidingWindowType=COUNT_BASED


########################
# Rate Limiter
########################

resilience4j.ratelimiter.instances.orderBreaker.timeout-duration=0s
resilience4j.ratelimiter.instances.orderBreaker.limit-refresh-period=4s
resilience4j.ratelimiter.instances.orderBreaker.limit-for-period=2


############################
# Rabbit mq configuration
############################


rabbitmq.exchange.name=order.exchange
rabbitmq.queue.name=order.queue
rabbitmq.routing.key=order.tracking